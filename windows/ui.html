<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Displays for Windows — Monitor History & Space Presets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #16171d;
      --card: #1f2129;
      --card-hover: #262934;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .header-sub {
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .conn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .conn-row:last-child { border-bottom: none; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .pill-main { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .pill-mirror { background: rgba(16,185,129,0.2); color: #34d399; }
    .pill-extend { background: rgba(168,85,247,0.2); color: #c084fc; }
    .pill-off { background: rgba(156,163,175,0.18); color: #9ca3af; }
    .spaces-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 10px;
      padding-bottom: 2px;
    }
    .space-tab {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .space-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .monitors-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
    }
    .mon-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    .mon-chip:hover { background: rgba(255,255,255,0.08); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #6b7280; }
    .dot.live { background: var(--green); }
    .preset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 7px;
      gap: 10px;
    }
    .preset-row.active {
      border-color: rgba(16,185,129,0.55);
      background: rgba(16,185,129,0.07);
    }
    .preset-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .preset-sub { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .badges-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }
    button.btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button.btn:hover { background: rgba(255,255,255,0.14); }
    button.btn-primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    button.btn-primary:hover { filter: brightness(1.1); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      background: #1f2129;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 16px;
      width: 92%;
      max-width: 430px;
    }
    .modal h3 { margin: 0 0 12px 0; font-size: 14px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .field input[type="text"], .field select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #14161b;
      color: #fff;
      font-size: 12px;
    }
    .status-toast {
      font-size: 11.5px;
      color: #34d399;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span>🖥 Displays</span>
      <span class="header-sub" id="headerSub">Monitor History & Presets (Windows)</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="openNewSpaceModal()">+ Space</button>
      <button class="btn" onclick="refreshState()">↻ Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="section-label">
      <span id="connHeader">CONNECTED TO THIS PC (0)</span>
      <div style="display:flex;gap:5px;">
        <button class="btn" onclick="applyQuickWin('@win:extend')">Extend All</button>
        <button class="btn" onclick="applyQuickWin('@win:clone')">Mirror All</button>
      </div>
    </div>
    <div id="connList"></div>
  </div>

  <div id="spacesWrap" style="display:none;">
    <div class="section-label"><span>SPACES / ROOMS</span></div>
    <div class="spaces-bar" id="spacesBar"></div>
  </div>

  <div id="spaceDetail"></div>
  <div class="status-toast" id="statusToast"></div>

  <!-- Edit Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    let state = { root: { folders: [] }, connected: [] };

    async function refreshState() {
      const res = await fetch('/api/state');
      state = await res.json();
      render();
    }

    async function saveRoot(toastMsg) {
      await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.root)
      });
      if (toastMsg) showToast(toastMsg);
      render();
    }

    async function applyCommand(presetId, command, label) {
      showToast('Applying ' + label + '...');
      await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ presetId, command })
      });
      await refreshState();
      showToast('Applied: ' + label);
    }

    function applyQuickWin(cmd) {
      applyCommand('', cmd, cmd === '@win:clone' ? 'Mirror All Displays' : 'Extend All Displays');
    }

    function showToast(msg) {
      const el = document.getElementById('statusToast');
      el.textContent = msg;
    }

    function selectedFolder() {
      const folders = state.root.folders || [];
      return folders.find(f => f.id === state.root.selectedFolderID) || folders[0];
    }

    function parseBadges(folder, preset) {
      const monsById = {};
      (folder.monitors || []).forEach(m => { monsById[m.id] = m; });
      const cmd = preset.command || '';
      if (cmd === '@win:external') {
        const tv = (folder.monitors || []).find(m => m.icon === 'tv.fill') || { label: 'TV (KVM)', icon: 'tv.fill' };
        return [{ label: tv.label, icon: '📺', role: 'MAIN', cls: 'pill-main' }];
      }
      const matches = [...cmd.matchAll(/"([^"]+)"/g)];
      const out = [];
      matches.forEach((m, segIdx) => {
        const seg = m[1];
        const isOff = seg.includes('enabled:false');
        let idPart = '';
        let ox = 0;
        seg.split(/\s+/).forEach(tok => {
          if (tok.startsWith('id:')) idPart = tok.slice(3);
          if (tok.startsWith('origin:(')) {
            const c = tok.slice(8, -1).split(',');
            ox = parseInt(c[0] || '0', 10);
          }
        });
        const ids = idPart.split('+').filter(Boolean);
        const visible = ids.filter(id => !(monsById[id] && monsById[id].ignoredInSpace));
        visible.forEach((id, uIdx) => {
          const rec = monsById[id] || { label: id, icon: 'display' };
          const icon = rec.icon === 'tv.fill' ? '📺' : (rec.icon === 'laptopcomputer' ? '💻' : '🖥');
          let role = 'EXTEND';
          let cls = 'pill-extend';
          if (isOff) { role = 'OFF'; cls = 'pill-off'; }
          else if (segIdx === 0 && ox === 0) {
            if (uIdx === 0 && visible.length === 1) { role = 'MAIN'; cls = 'pill-main'; }
            else if (uIdx === 0 && matches.length > 1) { role = 'MAIN'; cls = 'pill-main'; }
            else { role = 'MIRROR'; cls = 'pill-mirror'; }
          } else if (ox < 0) {
            role = 'EXT LEFT'; cls = 'pill-extend';
          }
          out.push({ label: rec.label, icon, role, cls });
        });
      });
      return out;
    }

    function render() {
      const conn = state.connected || [];
      document.getElementById('connHeader').textContent = `CONNECTED TO THIS PC (${conn.length})`;
      const connEl = document.getElementById('connList');
      if (conn.length === 0) {
        connEl.innerHTML = `<div style="color:var(--muted);font-size:12px;">No external displays detected</div>`;
      } else {
        connEl.innerHTML = conn.map(d => `
          <div class="conn-row">
            <div>
              <div style="font-weight:600;display:flex;align-items:center;gap:6px;">
                <span>${d.isBuiltIn ? '💻' : '🖥'} ${d.name}</span>
                ${d.isMain ? '<span class="pill pill-main">MAIN</span>' : ''}
                ${d.isMirrored ? '<span class="pill pill-mirror">MIRRORED</span>' : ''}
              </div>
              <div style="color:var(--muted);font-size:11px;">${d.resolution} @ ${d.hz}Hz · ${d.deviceName}</div>
            </div>
          </div>
        `).join('');
      }

      const folders = state.root.folders || [];
      document.getElementById('headerSub').textContent =
        folders.length > 1 ? 'Monitor History & Room Presets (Windows)' : 'Monitor History & Presets (Windows)';

      const spacesWrap = document.getElementById('spacesWrap');
      if (folders.length > 1) {
        spacesWrap.style.display = 'block';
        document.getElementById('spacesBar').innerHTML = folders.map(f => `
          <button class="space-tab ${f.id === selectedFolder().id ? 'active' : ''}" onclick="selectSpace('${f.id}')">
            📁 ${f.name} <span style="opacity:0.75;font-size:10px;">${(f.presets || []).length}</span>
          </button>
        `).join('');
      } else {
        spacesWrap.style.display = 'none';
      }

      const folder = selectedFolder();
      if (!folder) return;

      const connIDs = new Set(conn.map(c => c.id));
      const monsHtml = (folder.monitors || []).map(m => {
        const live = connIDs.has(m.id);
        const icon = m.ignoredInSpace ? '🚫' : (m.icon === 'tv.fill' ? '📺' : (m.icon === 'laptopcomputer' ? '💻' : '🖥'));
        return `
          <div class="mon-chip" onclick="openEditMonitorModal('${m.id}')">
            <span class="dot ${live ? 'live' : ''}"></span>
            <span>${icon} <b>${m.label}</b></span>
            ${m.note ? `<span style="color:var(--muted)">· ${m.note}</span>` : ''}
            ${m.ignoredInSpace ? `<span class="pill pill-off">HIDDEN</span>` : ''}
          </div>
        `;
      }).join('');

      const presetsHtml = (folder.presets || []).map(p => {
        const active = state.root.lastAppliedPresetID === p.id;
        const badges = parseBadges(folder, p).map(b => `
          <span class="role-badge">
            <span>${b.icon} ${b.label}</span>
            <span class="pill ${b.cls}">${b.role}</span>
          </span>
        `).join('');
        return `
          <div class="preset-row ${active ? 'active' : ''}">
            <div style="flex:1;min-width:0;">
              <div class="preset-title">
                <span>${p.name}</span>
                ${active ? '<span class="pill pill-mirror">ACTIVE</span>' : ''}
              </div>
              <div class="preset-sub">${p.subtitle || ''}</div>
              <div class="badges-row">${badges}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
              <button class="btn" title="Edit preset title & description" onclick="openEditPresetModal('${p.id}')">✎</button>
              <button class="btn btn-primary" onclick="applyCommand('${p.id}', ${JSON.stringify(p.command).replace(/"/g, '&quot;')}, ${JSON.stringify(p.name).replace(/"/g, '&quot;')})">Apply</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('spaceDetail').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <div style="font-size:12px;">
            <b>${folder.name}:</b> <span style="color:var(--muted)">${folder.description || ''}</span>
            <button class="btn" style="padding:2px 6px;margin-left:4px;" onclick="openEditSpaceModal()">✎ Edit Space</button>
          </div>
        </div>
        <div class="monitors-strip">
          <span style="font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;">MONITORS IN SPACE:</span>
          ${monsHtml}
          <button class="btn" style="padding:3px 8px;font-size:11px;" onclick="openEditMonitorModal('')">+ Monitor</button>
        </div>
        <div style="margin-top:6px;">${presetsHtml}</div>
      `;
    }

    function selectSpace(id) {
      state.root.selectedFolderID = id;
      saveRoot();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').style.display = 'none';
    }

    function openEditSpaceModal() {
      const f = selectedFolder();
      const m = document.getElementById('modalContent');
      m.innerHTML = `
        <h3>Edit Space / Room Info</h3>
        <div class="field">
          <label>Space / Room Name</label>
          <input type="text" id="spName" value="${f.name}" />
        </div>
        <div class="field">
          <label>Space Description & Monitor Context</label>
          <input type="text" id="spDesc" value="${f.description || ''}" />
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:12px;">
          ${state.root.folders.length > 1 ? `<button class="btn" onclick="keepOnlyThisSpace('${f.id}')">Only Keep '${f.name}' on This PC</button>` : '<span></span>'}
          <div style="display:flex;gap:6px;">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveSpaceEdit()">Save</button>
          </div>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    function saveSpaceEdit() {
      const f = selectedFolder();
      f.name = document.getElementById('spName').value.trim() || f.name;
      f.description = document.getElementById('spDesc').value.trim();
      closeModal();
      saveRoot('Saved space info');
    }

    function keepOnlyThisSpace(id) {
      state.root.folders = state.root.folders.filter(f => f.id === id);
      state.root.selectedFolderID = id;
      closeModal();
      saveRoot('Switched PC to Single-Space Mode');
    }

    function openNewSpaceModal() {
      const m = document.getElementById('modalContent');
      m.innerHTML = `
        <h3>Add New Space / Room</h3>
        <div class="field">
          <label>Space Name (e.g. Poway Home, CV Home, Office)</label>
          <input type="text" id="newSpName" placeholder="Poway Home" />
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="newSpDesc" placeholder="Desk Monitor + KVM TV + PC" />
        </div>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:12px;">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="createNewSpace()">Create Space</button>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    function createNewSpace() {
      const name = document.getElementById('newSpName').value.trim();
      if (!name) return;
      const desc = document.getElementById('newSpDesc').value.trim() || (name + ' display presets');
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      state.root.folders.push({
        id, name, description: desc,
        signatureUUIDs: [], displayAliases: {},
        monitors: [
          { id: id.toUpperCase() + '-MONITOR-1', label: 'Desk Monitor', note: 'Main Desk', icon: 'display', ignoredInSpace: false },
          { id: id.toUpperCase() + '-TV', label: 'Room TV', note: 'Via KVM / HDMI', icon: 'tv.fill', ignoredInSpace: false }
        ],
        presets: [
          { id: id + '-extend', name: 'Extend All Connected Displays', subtitle: 'Separate desktop across all connected displays', icon: 'rectangle.split.2x1.fill', command: '@win:extend' },
          { id: id + '-clone', name: 'Mirror All Connected Displays', subtitle: 'Same picture on Desk Monitor and TV', icon: 'rectangle.on.rectangle.circle.fill', command: '@win:clone' }
        ]
      });
      state.root.selectedFolderID = id;
      closeModal();
      saveRoot('Added space: ' + name);
    }

    function openEditMonitorModal(monId) {
      const f = selectedFolder();
      const existing = (f.monitors || []).find(x => x.id === monId);
      const mon = existing || { id: 'MON-' + Date.now(), label: '', note: '', icon: 'display', ignoredInSpace: false };
      const m = document.getElementById('modalContent');
      m.innerHTML = `
        <h3>${existing ? 'Edit Monitor in Space' : 'Add Monitor to Space History'}</h3>
        <div class="field">
          <label>Monitor Label (e.g. Desk Monitor, Samsung TV (KVM), Laptop)</label>
          <input type="text" id="mLabel" value="${mon.label}" />
        </div>
        <div class="field">
          <label>Location / History Note (e.g. Poway Desk, Room TV via KVM, Nearby on Desk)</label>
          <input type="text" id="mNote" value="${mon.note || ''}" />
        </div>
        <div class="field">
          <label>Icon</label>
          <select id="mIcon">
            <option value="display" ${mon.icon === 'display' ? 'selected' : ''}>🖥 Desk Monitor</option>
            <option value="tv.fill" ${mon.icon === 'tv.fill' ? 'selected' : ''}>📺 TV / KVM / Projector</option>
            <option value="laptopcomputer" ${mon.icon === 'laptopcomputer' ? 'selected' : ''}>💻 PC / Laptop Screen</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="mHide" ${mon.ignoredInSpace ? 'checked' : ''} />
          <label for="mHide" style="margin:0;">Hide this screen from preset badges in this space</label>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:12px;">
          ${existing ? `<button class="btn" style="color:#f87171;" onclick="deleteMonitor('${mon.id}')">Delete</button>` : '<span></span>'}
          <div style="display:flex;gap:6px;">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveMonitorEdit('${mon.id}', ${!!existing})">Save</button>
          </div>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    function saveMonitorEdit(id, existed) {
      const f = selectedFolder();
      f.monitors = f.monitors || [];
      const rec = {
        id,
        label: document.getElementById('mLabel').value.trim() || 'Monitor',
        note: document.getElementById('mNote').value.trim(),
        icon: document.getElementById('mIcon').value,
        ignoredInSpace: document.getElementById('mHide').checked
      };
      if (existed) {
        const idx = f.monitors.findIndex(x => x.id === id);
        if (idx >= 0) f.monitors[idx] = rec;
      } else {
        f.monitors.push(rec);
      }
      closeModal();
      saveRoot('Saved monitor: ' + rec.label);
    }

    function deleteMonitor(id) {
      const f = selectedFolder();
      f.monitors = (f.monitors || []).filter(x => x.id !== id);
      closeModal();
      saveRoot('Removed monitor');
    }

    function openEditPresetModal(presetId) {
      const f = selectedFolder();
      const p = (f.presets || []).find(x => x.id === presetId);
      if (!p) return;
      const m = document.getElementById('modalContent');
      m.innerHTML = `
        <h3>Edit Preset Title & Description</h3>
        <div class="field">
          <label>Preset Title</label>
          <input type="text" id="pName" value="${p.name}" />
        </div>
        <div class="field">
          <label>Description Text (Subtitle)</label>
          <input type="text" id="pSub" value="${p.subtitle || ''}" />
        </div>
        <div class="field">
          <label>Command</label>
          <input type="text" id="pCmd" value="${p.command.replace(/"/g, '&quot;')}" />
        </div>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:12px;">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="savePresetEdit('${p.id}')">Save Changes</button>
        </div>
      `;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    function savePresetEdit(id) {
      const f = selectedFolder();
      const p = (f.presets || []).find(x => x.id === id);
      if (!p) return;
      p.name = document.getElementById('pName').value.trim() || p.name;
      p.subtitle = document.getElementById('pSub').value.trim();
      p.command = document.getElementById('pCmd').value.trim() || p.command;
      closeModal();
      saveRoot('Updated preset: ' + p.name);
    }

    refreshState();
  </script>
</body>
</html>
