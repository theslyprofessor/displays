<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mainScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="leftScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rightScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stageArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glowCenter)"/>

  <!-- Stage Floor Grid Arc -->
  <path d="M 140 770 Q 512 690 884 770" fill="none" stroke="url(#stageArc)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M 200 825 Q 512 760 824 825" fill="none" stroke="url(#stageArc)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- Left Screen (Laptop / Extended Left - Violet) -->
  <g transform="translate(96, 330) rotate(-8, 130, 110)">
    <rect x="0" y="0" width="240" height="164" rx="22" fill="#0f172a" stroke="url(#leftScreenGrad)" stroke-width="12"/>
    <rect x="20" y="22" width="200" height="24" rx="8" fill="#a855f7" opacity="0.35"/>
    <rect x="20" y="60" width="130" height="16" rx="6" fill="#e9d5ff" opacity="0.85"/>
    <rect x="20" y="88" width="96" height="16" rx="6" fill="#c084fc" opacity="0.6"/>
    <rect x="20" y="118" width="76" height="24" rx="8" fill="#7c3aed"/>
  </g>

  <!-- Right Screen (Broadcast TV / KVM Mirror - Emerald) -->
  <g transform="translate(688, 330) rotate(8, 110, 110)">
    <rect x="0" y="0" width="240" height="164" rx="22" fill="#0f172a" stroke="url(#rightScreenGrad)" stroke-width="12"/>
    <rect x="20" y="22" width="200" height="24" rx="8" fill="#10b981" opacity="0.35"/>
    <rect x="20" y="60" width="140" height="16" rx="6" fill="#d1fae5" opacity="0.85"/>
    <rect x="20" y="88" width="104" height="16" rx="6" fill="#34d399" opacity="0.6"/>
    <rect x="20" y="118" width="88" height="24" rx="8" fill="#059669"/>
  </g>

  <!-- Center Main Studio Monitor (Hero - Electric Cyan/Blue) -->
  <g transform="translate(272, 210)">
    <rect x="0" y="0" width="480" height="320" rx="34" fill="#090d16" stroke="url(#mainScreenGrad)" stroke-width="18"/>
    <!-- Top Menu Bar Strip -->
    <rect x="26" y="26" width="428" height="38" rx="12" fill="#1e293b"/>
    <circle cx="52" cy="45" r="9" fill="#38bdf8"/>
    <circle cx="80" cy="45" r="9" fill="#34d399"/>
    <circle cx="108" cy="45" r="9" fill="#a855f7"/>
    <rect x="330" y="34" width="106" height="22" rx="8" fill="#0284c7"/>

    <!-- Center Screen Role Pill & Stage Bars -->
    <rect x="36" y="92" width="168" height="44" rx="14" fill="url(#mainScreenGrad)"/>
    <polygon points="66,102 71,112 82,113 74,120 76,130 66,125 56,130 58,120 50,113 61,112" fill="#ffffff"/>
    <rect x="94" y="106" width="90" height="16" rx="6" fill="#ffffff"/>

    <rect x="222" y="92" width="222" height="44" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
    <rect x="242" y="106" width="140" height="16" rx="6" fill="#bae6fd"/>

    <!-- Preset Rows -->
    <rect x="36" y="158" width="408" height="54" rx="14" fill="#111827" stroke="#334155" stroke-width="3"/>
    <circle cx="66" cy="185" r="11" fill="#34d399"/>
    <rect x="92" y="177" width="210" height="16" rx="6" fill="#f8fafc"/>
    <rect x="352" y="170" width="74" height="30" rx="10" fill="#0284c7"/>

    <rect x="36" y="228" width="408" height="54" rx="14" fill="#111827" stroke="#334155" stroke-width="3"/>
    <circle cx="66" cy="255" r="11" fill="#a855f7"/>
    <rect x="92" y="247" width="180" height="16" rx="6" fill="#cbd5e1"/>
    <rect x="352" y="240" width="74" height="30" rx="10" fill="#334155"/>

    <!-- Monitor Stand -->
    <path d="M 200 328 L 180 396 L 300 396 L 280 328 Z" fill="#334155"/>
    <rect x="140" y="394" width="200" height="18" rx="9" fill="#475569"/>
  </g>

  <!-- Bottom Brand Pill Badges (MAC / WIN / LINUX) -->
  <g transform="translate(212, 858)">
    <rect x="0" y="0" width="180" height="56" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="42" cy="28" r="10" fill="#38bdf8"/>
    <rect x="66" y="20" width="84" height="16" rx="6" fill="#e0f2fe"/>

    <rect x="210" y="0" width="180" height="56" rx="28" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
    <circle cx="252" cy="28" r="10" fill="#34d399"/>
    <rect x="276" y="20" width="84" height="16" rx="6" fill="#d1fae5"/>

    <rect x="420" y="0" width="180" height="56" rx="28" fill="#0f172a" stroke="#a855f7" stroke-width="4"/>
    <circle cx="462" cy="28" r="10" fill="#a855f7"/>
    <rect x="486" y="20" width="84" height="16" rx="6" fill="#f3e8ff"/>
  </g>
</svg>
